<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <script>window.__READER_STATIC__=true;</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Верни себе себя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/styles.css?v=block-stack1" />
  <script>
    (() => {
      const KEY = "reader-theme";
      const root = document.documentElement;

      function getTheme() {
        return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }

      function setTheme(theme) {
        const next = theme === "dark" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        try {
          localStorage.setItem(KEY, next);
        } catch (_) {}
        const btn = document.getElementById("theme-toggle");
        if (!btn) return;
        const dark = next === "dark";
        btn.setAttribute("aria-checked", dark ? "true" : "false");
        btn.setAttribute("aria-label", dark ? "Выключить тему Noir" : "Включить тему Noir");
        btn.title = dark ? "Тема Noir · выкл" : "Тема Noir · вкл";
      }

      try {
        const saved = localStorage.getItem(KEY);
        if (saved === "dark" || saved === "light") setTheme(saved);
      } catch (_) {}

      window.__readerTheme = { get: getTheme, set: setTheme, toggle: () => setTheme(getTheme() === "dark" ? "light" : "dark") };

      document.addEventListener("DOMContentLoaded", () => {
        setTheme(getTheme());
        const btn = document.getElementById("theme-toggle");
        if (!btn) return;
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          window.__readerTheme.toggle();
        });
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-sheen" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <p class="brand-mark">Верни себе себя</p>
      <p class="brand-sub">14 дней · курс</p>
    </div>
    <div class="top-actions">
      <div class="level-switch" role="tablist" aria-label="Уровень раскрытия">
        <button type="button" class="level-btn" data-level="philosophy">Философия</button>
        <button type="button" class="level-btn active" data-level="days">Дни</button>
        <button type="button" class="level-btn" data-level="goals">Дни + Цели</button>
        <button type="button" class="level-btn" data-level="toc">Содержание</button>
        <button type="button" class="level-btn" data-level="full">Курс полный</button>
      </div>
      <button type="button" class="ghost" id="expand-all">Раскрыть всё</button>
      <button type="button" class="ghost" id="collapse-all">Свернуть всё</button>
      <button
        type="button"
        class="noir-switch"
        id="theme-toggle"
        role="switch"
        aria-checked="false"
        aria-label="Включить тему Noir"
        title="Тема Noir · вкл"
      >
        <span class="noir-switch__rail" aria-hidden="true">
          <span class="noir-switch__sheen"></span>
          <span class="noir-switch__marks">
            <span class="noir-switch__mark noir-switch__mark--day"></span>
            <span class="noir-switch__mark noir-switch__mark--night"></span>
          </span>
          <span class="noir-switch__knob">
            <span class="noir-switch__facet"></span>
          </span>
        </span>
        <span class="noir-switch__caption">
          <span class="noir-switch__label noir-switch__label--day">Day</span>
          <span class="noir-switch__label noir-switch__label--noir">Night</span>
        </span>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="nav" id="nav"></aside>
    <section class="reader" id="reader">
      <p class="loading">Загрузка курса…</p>
    </section>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-title" id="modal-title">Редактирование</h2>
      <form id="modal-form" class="modal-form"></form>
      <div class="modal-actions">
        <button type="button" class="ghost" id="modal-cancel">Отмена</button>
        <button type="submit" form="modal-form" class="primary" id="modal-submit">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="static/app.js?v=block-stack1"></script>
</body>
</html>
